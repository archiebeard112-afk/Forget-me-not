name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # GitHub's Ubuntu runners ship with the Android SDK (ANDROID_HOME).
      - name: Build
        run: ./gradlew --no-daemon assembleDebug lintDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk forget-me-not.apk

      - uses: actions/upload-artifact@v4
        with:
          name: forget-me-not-apk
          path: forget-me-not.apk

      # A release gives a plain download link you can open on your phone.
      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ForgetMeNot build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Built from `${{ github.ref_name }}` at ${{ github.sha }}.
            On your phone: tap **forget-me-not.apk** below, then open it to install.
          files: forget-me-not.apk
